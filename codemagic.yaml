# Build do iOS sem Mac: o Codemagic compila num Mac da nuvem e manda pro TestFlight.
# Antes do 1º build: crie a integração "MyK7 ASC" no Codemagic (chave de API do App Store Connect)
# e troque APP_STORE_APPLE_ID pelo "Apple ID" numérico do app (App Store Connect → Informações do app).
workflows:
  ios-appstore:
    name: MyK7 iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: MyK7 ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.ntech.myk7
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: 0000000000
        APP_VERSION: 1.0.1
      node: 22
      xcode: latest
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Copiar web/ pro projeto iOS
        script: npx cap sync ios
      - name: Certificado e perfil de distribuição
        script: xcode-project use-profiles
      - name: Gerar o .ipa (build = último do TestFlight + 1)
        script: |
          LAST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          BUILD=$((LAST + 1))
          echo "Versão $APP_VERSION, build $BUILD"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD MARKETING_VERSION=$APP_VERSION"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
